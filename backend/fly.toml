# Fly.io config for AponRoots API.
# Deploy with `fly deploy` from the backend/ directory.

app = "aponroots-api"
primary_region = "sjc"

[build]

[mounts]
  source = "aponroots_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
